<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>qa-sentinel CLI デモ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#1b2230;--muted:#5b6675;--line:#cfd7e1;
 --t-bg:#0b0f16;--t-ink:#d7dee8;--t-dim:#6f7d90;--t-cmd:#ffd479;--t-ok:#7ee2a0;--t-bad:#ff8b8b;--t-ai:#8ab4ff;--t-hum:#f5a524;--t-chk:#c4b5fd;--t-box:#2a3648;--t-bar:#3b82f6;--t-barbg:#1d2735}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#171e28;--ink:#e6ebf2;--muted:#9aa7b8;--line:#2c3a4d;--t-bg:#05080d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#171e28;--ink:#e6ebf2;--muted:#9aa7b8;--line:#2c3a4d;--t-bg:#05080d;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "IBM Plex Sans JP",system-ui,sans-serif;padding:0 16px;padding-block:18px 40px;max-width:1120px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 12px;max-width:76ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:focus-visible,select:focus-visible{outline:2px solid var(--t-bar);outline-offset:2px}
.win{background:var(--t-bg);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161c26;color:#8391a3;font-size:12px}
.titlebar i{width:11px;height:11px;border-radius:50%;display:inline-block}.titlebar i:nth-child(1){background:#ff5f57}.titlebar i:nth-child(2){background:#febc2e}.titlebar i:nth-child(3){background:#28c840}
.titlebar span{margin-left:8px;font-family:"IBM Plex Mono",monospace}
.term{color:var(--t-ink);padding:14px 18px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;line-height:1.5;min-height:460px;max-height:600px;overflow:auto;white-space:pre;overflow-x:auto}
.cmd{color:var(--t-cmd);font-weight:500}.dim{color:var(--t-dim)}.ok{color:var(--t-ok)}.bad{color:var(--t-bad)}.ai{color:var(--t-ai)}.hum{color:var(--t-hum)}.chk{color:var(--t-chk)}.box{color:var(--t-box)}.b{font-weight:700}
.bar-fill{color:var(--t-bar)}.bar-bg{color:var(--t-barbg)}
.banner{display:inline-block;background:#3d2a08;color:#f5c26b;padding:0 8px;border-radius:3px}
.cursor::after{content:"▍";animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.spin{display:inline-block;width:1ch}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>

<h1>qa-sentinel CLI デモ</h1>
<p class="lead">ターミナルの実際の見え方。段の一覧に担当（AI／人／確認）と状態が常に出て、人の番になると黄色の帯で止まり、プロンプトで回答・結果入力・承認を受ける。</p>
<div class="bar">
  <select id="scenario" aria-label="シナリオ">
    <option value="m2" selected>M2 実装まで AI → 実行は人 → AI が分析・差し替え → 承認</option>
    <option value="m1">M1 全自動（確認待ちで一度止まる）</option>
    <option value="m3">M3 各段の出口で人が承認</option>
    <option value="watch">relay 監視（イベントなし。LLM 0 回）</option>
  </select>
  <button id="play" class="primary">▶ 再生</button><button id="step">次へ</button><button id="reset">最初から</button>
</div>
<div class="win"><div class="titlebar"><i></i><i></i><i></i><span>yuki@mac — qa-sentinel — 100×32</span></div><div class="term" id="term" aria-live="polite"></div></div>
<p class="note">色の意味: <span style="color:var(--t-cmd)">黄=人が打ったコマンド</span> · <span style="color:var(--t-ai)">青=AI（セッション内）</span> · <span style="color:var(--t-hum)">橙=人の番</span> · <span style="color:var(--t-chk)">紫=人の確認</span> · <span style="color:var(--t-ok)">緑=終了条件 OK</span> · <span style="color:var(--t-bad)">赤=止まった</span></p>

<script>
(function(){
const PH=[['test-plan','計画・影響分析'],['test-analysis','基本設計'],['test-strategy','詳細設計'],['test-design','ケース設計'],['test-implementation','ケース実装'],['test-execution','テスト実行'],['defect-analysis','不具合分析'],['test-completion','完了報告'],['regression-swap','差し替え'],['approval','最終承認']];
const W=96;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pad=(s,n)=>{let w=0;for(const ch of s)w+=/[　-鿿＀-￯]/.test(ch)?2:1;return s+' '.repeat(Math.max(0,n-w));};
function bar(p){const n=Math.round(p*30);return `<span class="bar-fill">${'█'.repeat(n)}</span><span class="bar-bg">${'░'.repeat(30-n)}</span> ${String(Math.round(p*100)).padStart(3)}%`;}
function header(task,ev,mode,sess,spent,budget){return `<span class="box">┌${'─'.repeat(W-2)}┐</span>\n<span class="box">│</span> <span class="b">qa-sentinel</span>  ${esc(task)}  <span class="dim">${esc(ev)}</span>${' '.repeat(Math.max(1,W-4-14-task.length-ev.length-2))}<span class="box">│</span>\n<span class="box">│</span> mode <span class="b">${mode}</span>   session <span class="ai">${sess}</span>   spent <span class="b">$${spent.toFixed(2)}</span> / $${budget.toFixed(2)}${' '.repeat(Math.max(1,W-4-44-sess.length))}<span class="box">│</span>\n<span class="box">└${'─'.repeat(W-2)}┘</span>`;}
function table(assign,states){
  let out=`  <span class="dim">${pad('#',3)}${pad('段',18)}${pad('担当',12)}${pad('状態',14)}終了条件</span>\n`;
  PH.forEach(([p,l],i)=>{const a=assign[p]||'ai';const st=states[p]||'';
    const who=a==='ai'?'<span class="ai">AI</span>        ':a==='human'?'<span class="hum">人</span>         ':'<span class="chk">AI→人確認</span> ';
    const icon={done:'<span class="ok">✔ done</span>     ',run:'<span class="ai">● running</span>  ',wait:'<span class="hum">⏸ 人の番</span>    ',chk:'<span class="chk">◆ 確認待ち</span>  ',bad:'<span class="bad">✖ blocked</span>  ',stop:'<span class="bad">■ stopped</span>  ',hand:'<span class="hum">⏸ 手渡し</span>    ','':'<span class="dim">○ pending</span>  '}[st];
    const gate={'test-plan':'impact','test-design':'cases','test-implementation':'pw-spec-lint','test-execution':'test-metrics --gate','regression-swap':'trace-check · weaken-check','approval':'check-approval'}[p]||'—';
    out+=`  ${pad(String(i+1).padStart(2,'0'),3)}${pad(l,18)}${who}${icon}<span class="dim">${gate}</span>\n`;});
  return out;}
const c=s=>({t:s,cls:'cmd',type:true});const o=(s,cls)=>({t:s,cls:cls||''});const raw=h=>({html:h});
const A_M2={'test-execution':'human',approval:'human'},A_M1={approval:'human'},A_M3=Object.fromEntries(PH.map(([p])=>[p,p==='approval'?'human':'check']));
const done=(...ps)=>Object.fromEntries(ps.map(p=>[p,'done']));
const S={
 m2:[
  [c('$ qa-sentinel run --project library-loan --nl "貸出上限を 5 冊から 3 冊に変更" --mode M2')],
  [raw(header('T-0042','evt_20260928_130001 (nl)','M2','ses_8f2a',0,5)),o(''),raw(table(A_M2,{'test-plan':'run'})),o(''),o('  <span class="spin">⠋</span> test-plan  trace-check --impact REQ-F-003','ai',true)],
  [o('  ✔ impact: BD-002 DD-004 UT-011 ST-005   C7 suspect: ST-005（根拠の版が古い）','ok'),o('  ✔ 計画: docs/quality/iso29119-test-plan.md','ok'),o(''),raw(table(A_M2,{...done('test-plan'),'test-analysis':'run'}))],
  [o('  ✔ 条件 4 件 · 方針表（対象外: UI 文言）· ケース ST-013 ST-014 ST-015 UT-020 · pw-spec-lint NG=0','ok'),o(''),raw(table(A_M2,{...done('test-plan','test-analysis','test-strategy','test-design','test-implementation'),'test-execution':'hand'})),o(''),raw(`  <span class="banner">⏸ 人の番: テスト実行（M2）</span>  セッション終了 $2.10  手順書 docs/quality/ST-013..015.md  スクリプト tests/e2e/loan-limit.spec.ts`),o('  結果を入れる:  qa-sentinel results T-0042   または  Web の受信箱','dim')],
  [c('$ qa-sentinel results T-0042'),o(''),o('  ST-013  4 冊目を拒否            期待: 「上限 3 冊」の拒否メッセージ','dim'),raw('  結果? <span class="cmd">[p]ass [f]ail [b]locked</span> › <span class="ok">PASS</span>   証跡 › <span class="dim">st013.png</span>'),o('  ST-014  3 冊目は成功            期待: 一覧が 3 件','dim'),raw('  結果? <span class="cmd">[p]ass [f]ail [b]locked</span> › <span class="bad">FAIL</span>   証跡 › <span class="dim">st014.png</span>'),raw('  観察（推測は書かない）› <span class="cmd">3 冊目のボタンが disabled。判定が <= の可能性</span>'),o('  ST-015  返却後の再貸出          期待: 成功','dim'),raw('  結果? › <span class="ok">PASS</span>'),o('  UT-020  AI 実行済 PASS（junit.xml）','dim'),o(''),raw(`  ${bar(1)}  PASS 3 / FAIL 1 / BLOCKED 0`),raw('  AI へ渡す? <span class="cmd">[Y/n]</span> › <span class="cmd">Y</span>')],
  [raw(header('T-0042','evt_20260928_130001_results (approval)','M2','ses_c9d0',2.10,5)),o(''),raw(table(A_M2,{...done('test-plan','test-analysis','test-strategy','test-design','test-implementation','test-execution'),'defect-analysis':'run'})),o(''),o('  <span class="spin">⠙</span> defect-analysis  ST-014 → 製品欠陥（loan.js:42 上限判定 <=）· 修整パッチ作成','ai',true)],
  [o('  ✔ ODC: 製品欠陥 1 · 修整 → 再実行は 人 へ差し戻し（M2）','ok'),o('  ✔ 完了報告 metrics:begin/end · 申し送り Medium 0 Low 1','ok'),o('  ✔ 差し替え: ST-005 → 失効(ST-013) · 追加 ST-013 ST-014 ST-015 UT-020 · trace-check NG=0 · weaken-check NG=0','ok'),o(''),raw(table(A_M2,{...done(...PH.slice(0,9).map(x=>x[0])),approval:'wait'})),o(''),raw(`  <span class="banner">⏸ 人の番: 最終承認</span>  セッション終了 $3.85 / $5.00  check-approval: exit 0`)],
  [c('$ qa-sentinel approve T-0042 --by yuki'),raw('  <span class="ok">✔</span> T-0042 done  approver=yuki  spent $3.85  sessions 2  人の判断 2 回（結果入力・承認）'),o('')],
 ],
 m1:[
  [c('$ qa-sentinel run --project library-loan --nl "上限到達時の扱いを変更" --mode M1')],
  [raw(header('T-0043','evt_20260928_140000 (nl)','M1','ses_9c11',0,5)),o(''),raw(table(A_M1,{...done('test-plan','test-analysis','test-strategy'),'test-design':'run'})),o(''),o('  <span class="spin">⠹</span> test-design  技法: 状態遷移 · 境界値','ai',true)],
  [o('  ✖ ST-013 期待結果を決められない: 上限到達時に予約へ誘導するか、拒否のみか（spec.md に無い）','bad'),o('  cases gate: exit 1  確認待ち 1 件','dim'),o(''),raw(table(A_M1,{...done('test-plan','test-analysis','test-strategy'),'test-design':'bad'})),o(''),raw(`  <span class="banner">✖ 止まりました: 確認待ち</span>  セッション終了 $1.90  回答: qa-sentinel answer T-0043`)],
  [c('$ qa-sentinel answer T-0043'),raw('  Q: 上限到達時に予約へ誘導しますか？ › <span class="cmd">誘導しない。拒否メッセージのみ</span>'),raw('  spec.md にも追記する? <span class="cmd">[Y/n]</span> › <span class="cmd">Y</span>'),o(''),raw(header('T-0043','evt_20260928_140000_answer (approval)','M1','ses_a377 (continue: test-design)',1.90,5)),raw(table(A_M1,{...done('test-plan','test-analysis','test-strategy'),'test-design':'run'}))],
  [o('  ✔ ケース 4 件 · 実装 · 実行 PASS 4 / FAIL 0（修整 1: ODC 製品欠陥）· 報告 · 差し替え NG=0','ok'),o(''),raw(table(A_M1,{...done(...PH.slice(0,9).map(x=>x[0])),approval:'wait'})),raw(`  <span class="banner">⏸ 人の番: 最終承認</span>  $3.20 / $5.00`),c('$ qa-sentinel approve T-0043 --by yuki'),raw('  <span class="ok">✔</span> T-0043 done  人の判断 2 回（回答・承認）')],
 ],
 m3:[
  [c('$ qa-sentinel run --project library-loan --nl "貸出上限を 3 冊に" --mode M3')],
  [raw(header('T-0044','evt_20260928_150000 (nl)','M3','ses_d001',0,5)),o(''),raw(table(A_M3,{'test-plan':'run'})),o('  <span class="spin">⠸</span> test-plan','ai',true)],
  [o('  ✔ impact: BD-002 DD-004 UT-011 ST-005 · 計画作成','ok'),raw(table(A_M3,{'test-plan':'chk'})),raw(`  <span class="banner">◆ 確認: test-plan の出口</span>  セッション終了 $0.40  成果物 docs/quality/iso29119-test-plan.md`),c('$ qa-sentinel review T-0044'),raw('  範囲 REQ-F-003 / レベル UT+ST / 終了基準 Critical/High 0 …  承認? <span class="cmd">[a]pprove [r]eject</span> › <span class="chk">a</span>')],
  [raw(header('T-0044','… (approval)','M3','ses_d002 (continue: test-analysis)',0.40,5)),raw(table(A_M3,{...done('test-plan'),'test-analysis':'run'})),o('  … 以下、各段の出口で同じように止まる（9 回）。1 段ごとにセッションが立つので予算は段数 × 単価','dim'),o('  M3 は監査要件が強い案件向け。日常は M1/M2 を推奨','dim')],
 ],
 watch:[
  [c('$ qa-sentinel watch --project proj-x'),raw('  tracker <span class="b">relay</span>  kind=jira  poll=10min  credential=env:JIRA_TOKEN  <span class="dim">LLM は起動しない</span>')],
  [raw('  13:00  GET /rest/api/2/search … updated >= 12:50   <span class="dim">polled: 0 events</span>'),raw('  13:10  <span class="dim">polled: 0 events</span>'),raw('  13:20  <span class="dim">polled: 0 events</span>'),raw('  13:30  <span class="dim">polled: 0 events</span>   <span class="dim">sessions_started 0 · tokens 0</span>')],
  [raw('  13:40  <span class="ok">polled: 1 event</span>  PROJ-123 「貸出上限の変更」  changed_ids=[REQ-F-003]'),raw(header('T-0045','evt_20260928_134000 (tracker)','M2','ses_e771',0,5)),raw(table(A_M2,{'test-plan':'run'})),o('  <span class="spin">⠼</span> test-plan  ← ここで初めて LLM が動く','ai',true)],
 ],
};
const $=id=>document.getElementById(id);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let steps=S.m2,i=-1,timer=null,busy=false,spin=null;
const F=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
async function put(line){const term=$('term');const el=document.createElement('div');term.appendChild(el);
  if(line.html){el.innerHTML=line.html;}
  else if(line.type&&!reduce){el.className=line.cls+' cursor';for(let k=0;k<line.t.length;k++){el.textContent=line.t.slice(0,k+1);term.scrollTop=term.scrollHeight;await new Promise(r=>setTimeout(r,16));}el.classList.remove('cursor');}
  else{el.className=line.cls;el.innerHTML=line.t.includes('<span')?line.t:esc(line.t);}
  term.scrollTop=term.scrollHeight;
  if(spin){clearInterval(spin);spin=null;}
  const sp=el.querySelector('.spin');if(sp&&!reduce){let k=0;spin=setInterval(()=>{sp.textContent=F[k++%F.length];},80);}
}
async function next(){if(busy||i>=steps.length-1){if(i>=steps.length-1)stop();return;}busy=true;i++;for(const ln of steps[i]){await put(ln);if(!reduce)await new Promise(r=>setTimeout(r,ln.type?200:70));}busy=false;}
function play(){if(timer){stop();return;}$('play').textContent='❚❚ 停止';timer=setInterval(async()=>{if(i>=steps.length-1){stop();return;}await next();},reduce?1800:3600);next();}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 再生';}
function reset(){stop();if(spin){clearInterval(spin);spin=null;}i=-1;busy=false;$('term').innerHTML='<div class="dim"># 再生を押す。「次へ」で 1 手ずつ</div>';}
$('play').onclick=play;$('step').onclick=()=>{stop();next();};$('reset').onclick=reset;
$('scenario').onchange=e=>{steps=S[e.target.value];reset();};
reset();
})();
</script>

</body>
