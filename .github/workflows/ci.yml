name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: 静的チェック
        run: ruff check .

      - name: Django システムチェック
        run: python manage.py check --settings=config.settings.test

      - name: 未作成のマイグレーションがないことを確認
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: テスト
        # AI_PROVIDER=local_hash なので外部 API を呼ばない。
        run: coverage run manage.py test apps --settings=config.settings.test

      - name: カバレッジ
        run: coverage report
