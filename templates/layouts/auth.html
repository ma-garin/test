{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | 計数ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="auth{% block auth_modifier %}{% endblock %}">
  {% block hero %}{% endblock %}
  <div class="auth-panel">
    <div class="auth-card{% block card_modifier %}{% endblock %}">
      <div class="auth-brand">
        <span class="hdr-mark">KD</span>
        <span>
          <strong>計数ダッシュボード</strong>
          <span>LINE MANAGER DASHBOARD</span>
        </span>
      </div>
      {% block step %}{% endblock %}
      {# 選択を弾いた理由はここでしか伝えられない。認証レイアウトにも枠を置く。 #}
      {% for message in messages %}
        <div class="callout{% if message.tags == 'error' %} d{% elif message.tags == 'warning' %} w{% elif message.tags == 'success' %} ok{% endif %}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
