{% extends "layouts/auth.html" %}
{% block card_modifier %} auth-card--panes{% endblock %}

{% block content %}
  <h2 class="auth-title">参照するテナントを選ぶ</h2>
  <p class="auth-lead">左で選ぶと、右にそのテナントの概要が出ます。所属外のテナントは表示されません。</p>

  <form method="post">
    {% csrf_token %}
    {% include "partials/tenant_picker.html" %}
    <button type="submit" class="btn-b">この内容で進む</button>
  </form>

  {% include "partials/picker_script.html" %}
{% endblock %}
