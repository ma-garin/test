{% extends "layouts/base.html" %}

{% block content %}
  <table class="card">
    <thead><tr><th>日時</th><th>操作</th><th>対象</th><th>成否</th><th>実施者</th></tr></thead>
    <tbody>
      {% for log in logs %}
        <tr>
          <td>{{ log.created_at|date:"Y-m-d H:i:s" }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.target }}</td>
          <td>{% if log.succeeded %}OK{% else %}NG{% endif %}</td>
          <td>{{ log.user|default:"-" }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="5">操作ログはありません。</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
