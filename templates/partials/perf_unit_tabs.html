{% comment %}
  金額の表示単位。1億を超える数字が並ぶと桁が読めないため、
  千円・百万円へ切り替えられるようにする。率と件数には効かない。
{% endcomment %}
<div class="unit-tabs" role="group" aria-label="金額の表示単位">
  <span class="unit-tabs-l">単位</span>
  {% for tab in unit_tabs %}
    <a class="unit-tab{% if tab.is_current %} on{% endif %}"
       {% if tab.is_current %}aria-current="true"{% endif %}
       href="?year={{ fiscal_year.code }}&amp;upto={{ upto|date:'Y-m' }}&amp;metric={{ metric }}&amp;unit={{ tab.key }}">{{ tab.label }}</a>
  {% endfor %}
</div>
