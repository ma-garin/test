[project]
name = "performance-dashboard"
version = "0.1.0"
description = "部・課・プロジェクト別の計数計画・実績・KPI 達成状況を管理するダッシュボード"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "var", "*/migrations/*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "C4"]
ignore = [
  # Django のモデルは __str__ を必ず定義しているが、抽象モデルでは不要。
  "DJ008",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_empty = true
