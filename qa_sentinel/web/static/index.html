<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>qa-sentinel 台帳</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1b2230;--muted:#5b6675;--line:#c9d2de;--accent:#d97706;--ok:#15803d;--stop:#b91c1c;--llm:#1d4ed8;--node:#eef2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#171e28;--ink:#e6ebf2;--muted:#9aa7b8;--line:#2c3a4d;--node:#1f2937;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:18px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:12px}
tr[data-task]{cursor:pointer}tr[data-task]:hover{background:var(--node)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.running{border-color:var(--accent);color:var(--accent)}.pill.done{border-color:var(--ok);color:var(--ok)}
.pill.blocked,.pill.stopped{border-color:var(--stop);color:var(--stop)}.pill.paused{border-color:var(--llm);color:var(--llm)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.step{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--node)}
.step.done{border-color:var(--ok)}.step.now{border-color:var(--accent);background:transparent;font-weight:600}.step.bad{border-color:var(--stop)}
#detail{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
pre{font-size:12px;white-space:pre-wrap;margin:8px 0 0}
button{font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<h1>qa-sentinel 台帳 <span class="muted">tasks/*.json を 5 秒ごとに再読</span></h1>
<table><thead><tr><th>タスク</th><th>プロジェクト</th><th>段</th><th>状態</th><th>予算</th><th>理由</th></tr></thead><tbody id="rows"></tbody></table>
<div id="detail" hidden></div>
<script>
let meta=null,cur=null;
async function j(u,o){const r=await fetch(u,o);return r.json()}
function pill(s){return `<span class="pill ${s}">${s}</span>`}
async function load(){
  meta=meta||await j('/api/meta');
  const ts=await j('/api/tasks');
  document.getElementById('rows').innerHTML=ts.map(t=>`<tr data-task="${t.task}"><td>${t.task}</td><td>${t.project}</td><td>${meta.labels[t.phase]||t.phase}</td><td>${pill(t.status)}</td><td>$${(t.session.spent_usd||0).toFixed(2)} / ${(t.session.budget_usd||0).toFixed(2)}</td><td>${t.reason||''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">タスクなし。CLI: qa-sentinel run --project library-loan --nl "..."</td></tr>';
  document.querySelectorAll('tr[data-task]').forEach(r=>r.onclick=()=>show(r.dataset.task));
  if(cur)show(cur);
}
async function show(id){
  cur=id;const t=await j('/api/tasks/'+id);const d=document.getElementById('detail');d.hidden=false;
  const doneSet=new Set(t.history.filter(h=>h.status==='done').map(h=>h.phase));
  const all=[...meta.phases,'waiting_human','done'];
  d.innerHTML=`<b>${t.task}</b> ${t.project} ${pill(t.status)} <span class="muted">event ${t.event} · session ${t.session.id||'-'}${t.session.ended?'（終了）':''}</span>
  <div class="steps">${all.map(p=>`<span class="step ${p===t.phase?(t.status==='blocked'||t.status==='stopped'?'bad now':'now'):(doneSet.has(p)?'done':'')}" title="${(meta.gates[p]||{}).gate||''}">${meta.labels[p]||p}</span>`).join('')}</div>
  <div class="muted">影響: ${t.impact.join(', ')||'-'} ／ 追加: ${t.cases.added.join(', ')||'-'} ／ 失効: ${t.cases.retired.join(', ')||'-'}</div>
  ${t.status==='paused'?`<p><button id="ap">承認する（approver: web）</button> <span class="muted">AI は approver を埋めない。ここは人が押す</span></p>`:''}
  <pre>${t.history.map(h=>`${h.at}  ${h.phase.padEnd(20)} ${h.status.padEnd(8)} ${h.reason||''}`).join('\n')}</pre>`;
  const b=document.getElementById('ap');if(b)b.onclick=async()=>{await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'task='+id+'&by=web'});load();};
}
load();setInterval(load,5000);
</script>
</body>
</html>
