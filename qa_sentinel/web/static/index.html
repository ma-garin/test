<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>qa-sentinel 台帳</title>
<!-- デザイン: yuki-aidd-kit AIDD Design System（ds/ は写し。画面側の CSS は var(--*) だけ） 読み込み順: tokens → components → layout
     画面は 3 つだけ: 1 伝える → 2 待つ／答える → 3 受け取る。工程図・金額・根拠・記録は「詳細」に畳む -->
<link rel="stylesheet" href="/static/ds/tokens.css">
<link rel="stylesheet" href="/static/ds/components.css">
<link rel="stylesheet" href="/static/ds/layout.css">
<style>
/* ── 画面固有（値はすべてトークン。幅・高さの px は検査対象外） ── */
.app-globalbar .brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-on-primary); font-size: var(--text-xs); font-weight: 700; }
.app-globalbar .field-inline { display: flex; align-items: center; gap: var(--space-2); }
.app-globalbar .field-inline .input { min-height: 36px; width: 180px; }   /* 高さ固定の帯に収める（token-exempt: 帯の高さ 44px に合わせた入力高） */
.sidebar nav a .count { margin-left: auto; }
html, body { height: 100%; overflow: hidden; }   /* PC 専用: ページはスクロールしない */
.app { height: 100dvh; } .app-body { min-height: 0; flex: 1 1 auto; } .maincol { min-height: 0; }
.app-content { overflow: hidden; display: flex; flex-direction: column; min-height: 0; align-items: center; }
.col { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: var(--space-3); flex: 1 1 auto; min-height: 0; }
.scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
.card { padding: var(--space-4) var(--space-5); }
.card > h2 { margin: 0 0 var(--space-2); font-size: var(--text-lg); }
.ask .row { display: flex; gap: var(--space-3); align-items: flex-start; }
.ask .textarea { flex: 1; min-height: 72px; font-size: var(--text-md); }
.ask .btn--primary { min-height: 72px; padding: 0 var(--space-6); font-size: var(--text-md); }
.ask .sub { display: flex; gap: var(--space-4); align-items: center; margin-top: var(--space-2); flex-wrap: wrap; }
.adv { margin-top: var(--space-3); } .adv > summary { cursor: pointer; }
.adv .grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--space-3); margin-top: var(--space-3); }
.now-item { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) 0; border-top: 1px solid var(--color-divider); }
.now-item:first-child { border-top: 0; } .now-item > div { flex: 1; min-width: 0; }
.now-item .t { font-weight: 600; } .now-item .s { color: var(--color-text-secondary); font-size: var(--text-sm); }
.head { display: flex; align-items: center; gap: var(--space-3); }
.head h1 { margin: 0; font-size: var(--text-xl); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act { border-left: 4px solid var(--color-high); }
.act.ai { border-left-color: var(--color-primary); } .act.bad { border-left-color: var(--color-critical); } .act.ok { border-left-color: var(--color-low); }
.act .lead { margin: 0 0 var(--space-2); font-size: var(--text-lg); font-weight: 700; display: flex; align-items: center; gap: var(--space-2); }
.act .q { font-size: var(--text-md); font-weight: 600; margin: 0 0 var(--space-2); }
.act .fields { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-2); }
.act .fields .textarea, .act .fields .input { flex: 1; min-height: var(--tap-min); }
.act .actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.body { display: flex; flex-direction: column; min-height: 0; }
.body .table-wrap { overflow: auto; }
.cases td.id { font-family: var(--font-mono); white-space: nowrap; }
.cases tr.retired td { color: var(--color-text-disabled); text-decoration: line-through; }
.cases tr.new td { background: var(--color-low-bg); }
.cases th, .cases td { vertical-align: top; }
.cases .wide { min-width: 200px; }
.out { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-3); }
.out .card { padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.out .card b { font-size: var(--text-md); } .out .card .muted { flex: 1; font-size: var(--text-sm); }
details.more { flex: 0 0 auto; } details.more > summary { cursor: pointer; padding: var(--space-2) 0; color: var(--color-text-secondary); }
details.more[open] { flex: 1 1 auto; min-height: 0; overflow: auto; }
.more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-top: var(--space-2); }
.more-grid .full { grid-column: 1 / -1; }
.flowc { display: block; width: 100%; height: 190px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: var(--space-1) var(--space-3); font-size: var(--text-sm); margin: 0; }
.kv dt { color: var(--color-text-secondary); } .kv dd { margin: 0; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: var(--space-2); padding: var(--space-1) 0; font-size: var(--text-sm); }
.tl .tm { color: var(--color-text-secondary); font-family: var(--font-mono); font-size: var(--text-xs); }
.ev { padding-left: var(--space-5); margin: var(--space-1) 0; font-size: var(--text-sm); }
.spin { display: inline-flex; animation: spin var(--motion-spin) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.help-note { font-size: var(--text-sm); color: var(--color-text-secondary); margin: 0 0 var(--space-2); }
.icon-inline { display: inline-flex; vertical-align: -3px; }   /* 3px: 文字の基線合わせ token-exempt */
.linkbtn { border: 0; background: none; padding: 0; color: var(--color-primary); font: inherit; cursor: pointer; text-decoration: underline; min-height: 0; }
.linkbtn:hover, .linkbtn:focus-visible { color: var(--color-primary-dark); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-globalbar">
    <span class="brand-mark" aria-hidden="true">QS</span><span class="brand">qa-sentinel</span>
    <span class="muted label-text">変わったことを 1 文で伝えると、AI がテストを作り直す</span>
    <span class="spacer"></span>
    <span class="field-inline"><label for="me" class="muted">あなたの名前</label><input class="input" id="me" placeholder="例: 藤曲" autocomplete="name"></span>
    <span class="badge badge-info" id="rt" title="練習モード。表示の金額は仮で、請求されません">練習モード（請求なし）</span>
    <button class="btn btn--ghost" id="theme" type="button" aria-label="テーマを切り替える（システム・ライト・ダーク）"><span class="label-text" id="theme-label">テーマ: システム</span></button>
  </header>
  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head"><span class="brand">メニュー</span><button class="btn btn--ghost" id="collapse" type="button" aria-label="サイドバーを折りたたむ"><span data-icon="arrow-back" data-icon-size="16" aria-hidden="true"></span></button></div>
      <nav aria-label="主要">
        <a href="#" data-nav="live" aria-current="page"><span class="icon" data-icon="checklist" data-icon-size="18" aria-hidden="true"></span><span class="label-text">伝える・進んでいるもの</span><span class="badge badge-high count" id="n-mine" hidden>0</span></a>
        <a href="#done" data-nav="done"><span class="icon" data-icon="download" data-icon-size="18" aria-hidden="true"></span><span class="label-text">完了して受け取る</span></a>
        <a href="/guide" target="_blank" rel="noopener"><span class="icon" data-icon="help" data-icon-size="18" aria-hidden="true"></span><span class="label-text">使い方</span></a>
      </nav>
    </aside>
    <div class="maincol">
      <main class="app-content">
        <section id="v-list" class="col">
          <div class="card ask">
            <h2>何が変わりましたか</h2>
            <div class="row"><textarea class="textarea" id="nl" rows="2" placeholder="例: 貸出上限を 5 冊から 3 冊に変更" aria-label="何が変わったか"></textarea><button class="btn btn--primary" id="go" type="button"><span data-icon="play" data-icon-size="18" aria-hidden="true"></span>AI に任せる</button></div>
            <div class="sub"><span class="muted">AI が影響を調べてテストを作り直し、あなたは止まったところで OK するだけ。</span><button class="linkbtn" id="demo-go" type="button">まず例のデモで見る（請求なし）</button></div>
            <details class="adv"><summary class="muted">詳しい設定（ふつうは変えなくてよい）</summary>
              <div class="grid">
                <div class="field"><label for="r-mode">AI にどこまで任せるか</label><select class="input" id="r-mode"></select></div>
                <div class="field"><label for="r-budget">AI に使ってよい上限（USD）</label><input class="input" id="r-budget" type="number" min="0" step="0.5" value="5"></div>
                <div class="field"><label for="r-project">対象プロジェクト</label><input class="input" id="r-project" value="library-loan"></div>
              </div>
              <p class="help-note" id="r-preview"></p>
            </details>
            <div class="banner-err" id="r-err" hidden></div>
          </div>
          <div class="card scroll" id="now" hidden>
            <h2>いま進んでいるもの</h2>
            <div id="now-body"></div>
          </div>
        </section>
        <section id="v-detail" class="col" hidden></section>
      </main>
    </div>
  </div>
</div>

<script src="/static/ds/icons.js"></script>
<script src="/static/ds/feedback.js"></script>
<script src="/static/progress-views.js"></script>
<script>
/* ===================== state ===================== */
let meta=null,tasks=[],cur=null,view='live';
const MINE=new Set(['review','handoff','blocked','paused']);
const WHO={review:'あなたが OK する番',handoff:'あなたがテストする番',blocked:'AI の質問に答える番',paused:'最後の承認をする番',running:'AI が作業中（待つだけ）',done:'完了',stopped:'止まっています',queued:'準備中'};
const NEXT={review:'AI の下書きを見て OK する',handoff:'手順どおりにテストして、結果を渡す',blocked:'AI の質問に答える',paused:'内容を見て承認する',running:'待つだけ',done:'成果物を受け取る',stopped:'始め直す',queued:''};
const SEV={review:'high',handoff:'high',paused:'high',blocked:'high',stopped:'critical',running:'info',done:'low',queued:'info'};
const LABEL_PLAIN={'test-plan':'影響の洗い出し','test-analysis':'確かめることの整理','test-strategy':'確かめ方の整理','test-design':'テストの表づくり','test-implementation':'テストの準備','test-execution':'テストの実行','defect-analysis':'失敗の原因分け','test-completion':'結果のまとめ','regression-swap':'古いテストの入れ替え','waiting_human':'最後の承認','done':'完了'};
const REASON_PLAIN=r=>String(r||'').replace(/^rejects_exceeded:(\S+)/,(m,p)=>`「${LABEL_PLAIN[p]||p}」を 3 回やり直したので止めました`).replace(/^questions_exceeded/,'AI の質問が 5 件を超えたので止めました').replace(/^sessions_exceeded/,'AI の起動が 10 回を超えたので止めました').replace(/^budget_reached/,'上限の金額に達しました').replace(/^not_converged/,'テストが収束しなかったので止めました').replace(/^swap_ng:.*/,'古いテストの入れ替えで検査に通らず、元に戻しました').replace(/^swap_error:.*/,'古いテストの入れ替えに失敗しました').replace(/ — 進め方を見直してください（docs\/06 §3）/,'');
const MODES={M1:'全部 AI（最後の承認だけあなた）',M2:'準備まで AI、実行はあなた（おすすめ）',M3:'段ごとに毎回確認',M4:'設計まで AI、実装から先はあなた',M5:'実行と分析だけ AI',M6:'古いテストの入れ替えだけ AI',M7:'あなたが作って AI に見てもらう',M8:'一段ごとに交互'};
const FL=[['test-plan','計画'],['test-analysis','基本設計'],['test-strategy','詳細設計'],['test-design','設計'],['test-implementation','準備'],['test-execution','実行'],['defect-analysis','原因'],['test-completion','報告'],['regression-swap','入替'],['final','承認']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(n,s=16)=>`<span class="icon-inline" data-icon="${n}" data-icon-size="${s}" aria-hidden="true"></span>`;
const paintIcons=root=>{if(window.Icons&&window.Icons.render)window.Icons.render(root||document);};
async function j(u){return (await fetch(u)).json()}
function post(u,body){return fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)}).then(r=>r.json())}
const label=p=>LABEL_PLAIN[p]||(meta&&meta.labels[p])||p;
const money=t=>[t.session&&t.session.spent_usd||0,t.plan&&t.plan.budget_usd||t.session&&t.session.budget_usd||0];
const isHum=t=>MINE.has(t.status);
const me=()=>$('me').value.trim();
const badge=t=>`<span class="badge badge-${SEV[t.status]||'info'}">${WHO[t.status]||t.status}</span>`;
const fail=(msg,detail,retry)=>window.Feedback?Feedback.error(msg,{detail,action:{label:retry?'もう一度送る':'読み直す',onClick:()=>(retry||load)()}}):console.error(msg,detail);
const ok=msg=>window.Feedback?Feedback.ok(msg):null;
let loadErrShown=false;
try{$('me').value=localStorage.getItem('qa-name')||''}catch(e){}
$('me').addEventListener('change',()=>{try{localStorage.setItem('qa-name',me())}catch(e){}});
const THEMES=[['','システム'],['light','ライト'],['dark','ダーク']];
function applyTheme(v){const r=document.documentElement;if(v)r.dataset.theme=v;else delete r.dataset.theme;try{v?localStorage.setItem('qa-theme',v):localStorage.removeItem('qa-theme')}catch(e){}const lb=$('theme-label');if(lb)lb.textContent='テーマ: '+(THEMES.find(x=>x[0]===v)||THEMES[0])[1]}
$('theme').addEventListener('click',()=>{const c=document.documentElement.dataset.theme||'';const i=THEMES.findIndex(x=>x[0]===c);applyTheme(THEMES[(i+1)%THEMES.length][0])});
try{applyTheme(localStorage.getItem('qa-theme')||'')}catch(e){}
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;a.click();ok(name+' を保存しました')};

/* ===================== 画面 1: 伝える ===================== */
async function load(){
  try{
    if(!meta){meta=await j('/api/meta');buildModes();}
    tasks=(await j('/api/tasks')).sort((a,b)=>(isHum(b)?1:0)-(isHum(a)?1:0)||(b.updated_at||'').localeCompare(a.updated_at||''));
  }catch(e){if(!loadErrShown){loadErrShown=true;fail('台帳を読めませんでした',String(e));}return;}
  loadErrShown=false;
  const live=view==='done'?tasks.filter(t=>t.status==='done'):tasks.filter(t=>t.status!=='done');
  $('n-mine').textContent=tasks.filter(isHum).length;$('n-mine').hidden=!tasks.filter(isHum).length;
  $('now').hidden=!live.length;$('now').querySelector('h2').textContent=view==='done'?'完了したもの（成果物を受け取る）':'いま進んでいるもの';document.querySelector('#v-list .ask').hidden=view==='done';
  $('now-body').innerHTML=live.map(t=>`<div class="now-item"><div><div class="t">${esc(t.nl||t.project)} <span class="muted">${t.task}</span></div><div class="s">${WHO[t.status]||t.status}${NEXT[t.status]?' — '+NEXT[t.status]:''}${t.status==='stopped'?'（'+esc(REASON_PLAIN(t.reason))+'）':''}</div></div>${badge(t)}<a class="btn ${isHum(t)||t.status==='done'?'btn--primary':''}" href="#task/${t.task}">${t.status==='done'?'受け取る':isHum(t)?'開く':'様子を見る'}</a></div>`).join('');
  paintIcons($('v-list'));
  if(cur)show(cur,true);
}
function buildModes(){const s=$('r-mode');s.innerHTML=Object.keys(meta.presets).map(k=>`<option value="${k}" ${k==='M2'?'selected':''}>${k} ${MODES[k]||''}</option>`).join('');s.addEventListener('change',preview);preview()}
function preview(){const m=$('r-mode').value,p=meta.presets[m];if(!p)return;$('r-preview').textContent=`止まってあなたに聞く段: ${p.stop_at.map(label).join('・')||'最後だけ'}。あなたがやる段: ${meta.phases.filter(x=>!p.draft.includes(x)).map(label).join('・')||'なし'}`}
$('go').addEventListener('click',async()=>{const err=$('r-err');const nl=$('nl').value.trim(),by=me();
  if(!nl){err.textContent='何が変わったかを 1 文で書いてください。';err.hidden=false;$('nl').focus();return}
  if(!by){err.textContent='右上の「あなたの名前」を入れてください。OK や承認はこの名前で記録されます。';err.hidden=false;$('me').focus();return}
  err.hidden=true;const b=$('go');b.setAttribute('aria-busy','true');b.textContent='AI が調べています…';
  try{const r=await post('/api/run',{project:$('r-project').value,nl,mode:$('r-mode').value,reviewer:by,budget:$('r-budget').value});
    if(r.error){err.textContent='始められませんでした: '+r.error;err.hidden=false;return}
    $('nl').value='';ok(r.task+' を始めました');await load();location.hash='#task/'+r.task}
  catch(e){err.textContent='送れませんでした: '+e+'。画面を起動し直してからもう一度。';err.hidden=false}
  finally{b.removeAttribute('aria-busy');b.innerHTML=ico('play',18)+'AI に任せる';paintIcons(b)}});
const startDemo=async()=>{const b=$('demo-go');b.setAttribute('aria-busy','true');const t0=b.textContent;b.textContent='AI が調べています…';
  try{const r=await post('/api/demo',{by:me()||'demo'});if(r.error){fail('デモを始められませんでした',r.error,startDemo);return}ok(r.task+' を始めました。あなたの番です');await load();location.hash='#task/'+r.task}
  catch(e){fail('デモを送れませんでした',String(e),startDemo)}
  finally{b.removeAttribute('aria-busy');b.textContent=t0}};
$('demo-go').addEventListener('click',startDemo);
function nav(v){cur=null;view=v;$('v-detail').hidden=true;$('v-list').hidden=false;document.querySelectorAll('#sidebar nav a[data-nav]').forEach(a=>{if(a.dataset.nav===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});load()}
function route(){const h=location.hash;if(h.startsWith('#task/'))show(h.slice(6));else nav(h==='#done'?'done':'live')}
$('collapse').addEventListener('click',()=>$('sidebar').classList.toggle('collapsed'));
window.addEventListener('hashchange',route);

/* ===================== 画面 2・3: 待つ／答える・受け取る ===================== */
const idxOf=t=>Math.max(0,FL.findIndex(x=>x[0]===(t.phase==='waiting_human'||t.phase==='done'?'final':t.phase)));
const modeOf=t=>t.status==='done'?'done':t.status==='blocked'?'ask':isHum(t)?'human':t.status==='running'?'ai':t.status==='stopped'?'stopped':'idle';
const casesOf=t=>{const d=t.draft&&t.draft['test-design'];return d&&d.cases?d.cases:[]};
const csvOf=t=>['テストID,対象,目的,手順,期待される結果,重要度,根拠の版,状態',...casesOf(t).map(c=>[c.id,c.target,c.purpose,c.steps,c.expected,c.sev,c.basis,c.state==='retired'?'失効':'追加'].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');
const stepsOf=t=>{const d=t.draft&&t.draft['test-implementation'];return d&&d.steps?d.steps:[]};
const reportOf=t=>[`# 完了報告 ${t.task}`,'',`変更: ${t.nl||''}`,`プロジェクト: ${t.project}`,`影響: ${t.impact.join(', ')||'-'}`,`追加したテスト: ${t.cases.added.join(', ')||'なし'}`,`入れ替えた古いテスト: ${t.cases.retired.join(', ')||'なし'}`,`AI に使った金額: $${money(t)[0].toFixed(2)} / 上限 $${money(t)[1].toFixed(2)}`,'',`## 判断の記録`,...t.decisions.map(x=>`- ${x.at.slice(0,16).replace('T',' ')} ${x.by}: ${({confirm:'確定',reject:'差し戻し',submit:'結果を渡した',answer:'回答',approve:'承認'})[x.kind]||x.kind}（${label(x.phase)}）${x.note?' — '+x.note:''}`),'',`## 根拠`,...meta.phases.filter(p=>t.evidence[p]).flatMap(p=>[`### ${label(p)}`,...t.evidence[p].map(e=>`- ${e}`)]),'',`成果物: ${Object.values(t.artifacts||{}).join(', ')||'-'}（作業ブランチ ${t.branch||'-'}）`].join('\n');
function casesTable(t,note){const rows=casesOf(t);if(!rows.length)return '';
  return `<p class="help-note">${note||''}<span class="badge badge-new">追加</span> は新しいテスト、取り消し線は入れ替えで外す古いテスト</p><div class="table-wrap"><table class="table cases"><thead><tr><th>ID</th><th>対象</th><th class="wide">手順</th><th class="wide">期待される結果</th><th>重要度</th></tr></thead><tbody>${rows.map(c=>`<tr class="${c.state||''}"><td class="id">${esc(c.id)}</td><td>${esc(c.target)}<br><span class="muted">${esc(c.purpose)}</span></td><td>${esc(c.steps)}</td><td>${esc(c.expected)}</td><td><span class="badge badge-${({Critical:'critical',High:'high',Medium:'medium',Low:'low'})[c.sev]||'info'}">${esc(c.sev)}</span></td></tr>`).join('')}</tbody></table></div>`}
function draftOf(t){const D=t.draft||{},ph=t.phase,dr=D[ph];
  if(dr&&dr.cases)return casesTable(t,`${esc(dr.title||label(ph))} — `);
  if(dr&&dr.steps)return `<p class="help-note">${esc(dr.title||'手順')}</p><ol>${dr.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
  if(dr&&dr.text)return `<p class="help-note">${esc(dr.title||label(ph))}</p><pre>${esc(dr.text)}</pre>`;
  const a=t.artifacts[ph]||t.artifacts.plan;return `<div class="callout callout--info">この段の下書きはファイルにあります${a?`: <span class="mono">${esc(a)}</span>`:''}（作業ブランチ <span class="mono">${esc(t.branch||'')}</span>）</div>`}
async function show(id,silent){
  let t;try{t=await j('/api/tasks/'+id);}catch(e){fail('タスクを読めませんでした',String(e));return}
  if(t.error){fail('タスクが見つかりません',id);location.hash='';return}
  const first=cur!==id;cur=id;$('v-list').hidden=true;const d=$('v-detail');d.hidden=false;
  const who=me()||t.plan.reviewer||'';
  const ph=label(t.phase);let act='',body='',cls='';
  if(t.status==='review'){act=`<p class="lead">${ico('person',20)}AI が「${ph}」を作りました。下を見て、良ければ OK</p><div class="fields"><textarea class="textarea" id="note" rows="1" placeholder="直したい点があれば書く（やり直しの理由になります）"></textarea></div><div class="actions"><button class="btn btn--primary" id="ok" type="button">${ico('check-circle')}OK（次へ進める）</button><button class="btn" id="rej" type="button">${ico('arrow-back')}やり直してもらう</button></div>`;body=draftOf(t)}
  else if(t.status==='handoff'){act=`<p class="lead">${ico('person',20)}「${ph}」はあなたの番です。下の手順でテストして、結果を渡す</p><div class="fields"><textarea class="textarea" id="note" rows="1" placeholder="結果（例: 12 件 PASS、1 件 FAIL: ST-014 の期待値が違う）"></textarea><input class="input" id="file" placeholder="結果ファイル（あれば。例: results/${esc(t.task)}.csv）"></div><div class="actions"><button class="btn btn--primary" id="sub" type="button">${ico('arrow-forward')}結果を渡す</button></div>`;
    const st=stepsOf(t);body=(st.length?`<p class="help-note">プロジェクトのフォルダでコマンドプロンプトを開いて実行</p><ol>${st.map(x=>`<li>${esc(x.replace('<task>',t.task))}</li>`).join('')}</ol>`:'')+casesTable(t,'確かめるテスト — ')}
  else if(t.status==='blocked'){act=`<p class="lead">${ico('help',20)}AI からの質問。答えると続きが進みます</p><p class="q">${esc(REASON_PLAIN(t.reason).replace(/^確認待ち:\s*/,''))}</p><div class="fields"><textarea class="textarea" id="note" rows="1" placeholder="答え"></textarea></div><div class="actions"><button class="btn btn--primary" id="ans" type="button">${ico('play')}答える</button></div>`;body=draftOf(t)}
  else if(t.status==='paused'){cls='ok';act=`<p class="lead">${ico('check-circle',20)}AI の作業は終わりました。下の表を見て、問題なければ承認</p><p class="muted">追加 ${t.cases.added.length} 件・入れ替え ${t.cases.retired.length} 件。承認はあなたの名前で記録されます（AI は承認できません）。</p><div class="actions"><button class="btn btn--primary" id="ap" type="button">${ico('check-circle')}承認する</button></div>`;body=casesTable(t)}
  else if(t.status==='running'){cls='ai';act=`<p class="lead"><span class="spin">${ico('progress-activity',20)}</span>AI が「${ph}」を作っています。待つだけ</p><p class="muted">終わると、ここに「あなたがすること」が出ます。画面は自動で更新されます。</p>`;body=draftOf(t)}
  else if(t.status==='stopped'){cls='bad';act=`<p class="lead">${ico('circle-alert',20)}止まりました</p><p class="q">${esc(REASON_PLAIN(t.reason))}</p><p class="muted">これまでの記録は残っています。始め直すと、進め方や上限金額を変えられます。</p><div class="actions"><button class="btn btn--primary" id="redo" type="button">${ico('refresh')}始め直す</button></div>`;body=draftOf(t)}
  else if(t.status==='done'){cls='ok';act=`<p class="lead">${ico('check-circle',20)}完了。成果物を受け取ってください</p><div class="out"><div class="card"><b>テストの表</b><span class="muted">追加 ${t.cases.added.length} 件・入れ替え ${t.cases.retired.length} 件（CSV）</span><button class="btn btn--primary" id="dl-csv" type="button">${ico('download')}保存</button></div><div class="card"><b>実行手順</b><span class="muted">テストの動かし方（テキスト）</span><button class="btn" id="dl-steps" type="button">${ico('download')}保存</button></div><div class="card"><b>完了報告</b><span class="muted">影響・判断の記録・根拠（Markdown）</span><button class="btn" id="dl-rep" type="button">${ico('download')}保存</button></div></div>`;body=casesTable(t)}
  else{cls='ai';act=`<p class="lead">${ico('progress-activity',20)}準備中</p>`}
  if(first||!d.querySelector('#act')){
    d.innerHTML=`<div class="head"><a class="btn btn--ghost" href="${view==='done'?'#done':'#'}">${ico('arrow-back')}戻る</a><h1 id="ttl"></h1><span id="d-badge"></span></div>
      <div class="card act" id="act"></div>
      <div class="card body scroll" id="body"></div>
      <details class="more" id="more"><summary>詳細（どこまで進んだか・AI に使った金額・なぜそう判断したか・記録）</summary><div class="more-grid" id="more-body"></div></details>`;
    $('more').addEventListener('toggle',()=>{if($('more').open)renderMore(t)});
  }
  $('ttl').textContent=t.nl||t.project;$('d-badge').innerHTML=badge(t);
  const a=$('act');a.className='card act '+cls;a.innerHTML=act;$('body').innerHTML=body||'<p class="muted">まだ見せるものはありません</p>';$('body').hidden=!body;
  setFlow(t);if($('more').open)renderMore(t);paintIcons(d);
  const val=id=>$(id)?$(id).value:'';const need=()=>{if(!who){fail('右上の「あなたの名前」を入れてください','OK・回答・承認は名前つきで記録されます');$('me').focus();return false}return true};
  const done=async(r,msg,errMsg,retry)=>{if(r.error){fail(errMsg,r.error,retry);return}ok(msg);await load();show(id,true)};
  const wire=(bid,fn,errMsg)=>{const el=$(bid);if(!el)return;const run=async()=>{if(!need())return;el.setAttribute('aria-busy','true');const t0=el.innerHTML;el.textContent='処理中…';try{await fn(run)}catch(e){fail(errMsg,String(e),run)}finally{el.removeAttribute('aria-busy');el.innerHTML=t0;paintIcons(el)}};el.addEventListener('click',run)};
  wire('ok',async(run)=>done(await post('/api/review',{task:id,by:who,ok:'1',note:val('note')}),'次へ進めました','OK を送れませんでした',run),'OK を送れませんでした');
  wire('rej',async(run)=>done(await post('/api/review',{task:id,by:who,ok:'0',note:val('note')}),'AI がやり直します','やり直しを送れませんでした',run),'やり直しを送れませんでした');
  wire('sub',async(run)=>done(await post('/api/submit',{task:id,by:who,file:val('file'),note:val('note')}),'結果を受け取りました','結果を送れませんでした',run),'結果を送れませんでした');
  wire('ans',async(run)=>done(await post('/api/answer',{task:id,by:who,text:val('note')}),'答えを記録し、再開しました','答えを送れませんでした',run),'答えを送れませんでした');
  wire('ap',async(run)=>done(await post('/api/approve',{task:id,by:who}),'承認しました','承認できませんでした',run),'承認できませんでした');
  if($('redo'))$('redo').addEventListener('click',()=>{location.hash='';$('nl').value=t.nl||'';$('r-project').value=t.project;$('nl').focus()});
  if($('dl-csv'))$('dl-csv').addEventListener('click',()=>dl(`${t.task}_テストの表.csv`,csvOf(t),'text/csv'));
  if($('dl-steps'))$('dl-steps').addEventListener('click',()=>dl(`${t.task}_実行手順.txt`,stepsOf(t).map((x,i)=>`${i+1}. ${x.replace('<task>',t.task)}`).join('\n')||'（手順なし）','text/plain'));
  if($('dl-rep'))$('dl-rep').addEventListener('click',()=>dl(`${t.task}_完了報告.md`,reportOf(t),'text/markdown'));
}
function setFlow(t){const S=PV.state;S.phases=FL.map(x=>x[1]);S.cur=idxOf(t);S.title=`${t.task} ${t.nl||t.project}`;S.mode=modeOf(t);
  S.label={review:'OK する',handoff:'テストして渡す',paused:'承認',blocked:'質問に答える',stopped:REASON_PLAIN(t.reason)}[t.status]||'';
  const [s,b]=money(t);S.cost={spent:s,budget:b};S.stops=(t.plan.stop_at||[]).map(p=>FL.findIndex(x=>x[0]===p)).filter(i=>i>=0);
  S.human=meta.phases.filter(p=>t.plan.draft&&!t.plan.draft.includes(p)).map(p=>FL.findIndex(x=>x[0]===p)).filter(i=>i>=0);
  S.log=[];S.who=t.plan.reviewer||'';S.evidence=t.evidence[t.phase]||[]}
function renderMore(t){const el=$('more-body');const [s,b]=money(t),pct=b?Math.min(100,s/b*100):0;const span=a=>!a.length?'なし':a.length<=3?a.join('・'):`${a[0]} 〜 ${a[a.length-1]}（${a.length} 段）`;
  el.innerHTML=`<div class="card full"><h2>どこまで進んだか</h2><p class="help-note">上の段は AI、真ん中はあなた、下は自動検査。色の付いた箱がいまの位置</p><canvas id="flow-canvas" class="flowc" role="img" aria-label="進み具合"></canvas></div>
    <div class="card"><h2>AI に使った金額（累計）</h2><div class="score-card"><span class="score-value">$${s.toFixed(2)} <span class="muted score-label">/ 上限 $${b.toFixed(2)}</span></span><div class="score-bar"><span class="score-fill" style="width:${pct}%"></span></div><span class="score-label">${t.session.ended?'いま AI は動いていません':'AI が動いています'}${$('rt').textContent.startsWith('練習')?'。練習モードの金額は仮で、請求されません':''}</span></div>
      <h2>AI に任せる範囲</h2><dl class="kv"><dt>AI がやる</dt><dd>${span((t.plan.draft||[]).map(label))}</dd><dt>あなたがやる</dt><dd>${span(meta.phases.filter(p=>!(t.plan.draft||[]).includes(p)).map(label))}</dd><dt>止まって聞く</dt><dd>${span((t.plan.stop_at||[]).map(label))}</dd><dt>影響</dt><dd>${esc(t.impact.join(', ')||'-')}</dd><dt>作業ブランチ</dt><dd class="mono">${esc(t.branch||'-')}</dd></dl></div>
    <div class="card"><h2>なぜそう判断したか</h2>${meta.phases.filter(p=>t.evidence[p]).map(p=>`<details ${p===t.phase?'open':''}><summary>${label(p)}（${t.evidence[p].length} 件）</summary><ul class="ev">${t.evidence[p].map(e=>`<li>${esc(e)}</li>`).join('')}</ul></details>`).join('')||'<p class="muted">まだ根拠がありません</p>'}
      <h2>記録</h2><ul class="tl">${[...t.history.map(h=>({at:h.at,txt:`${label(h.phase)} — ${WHO[h.status]||h.status}${h.reason?' · '+esc(REASON_PLAIN(h.reason)):''}`})),...t.decisions.map(x=>({at:x.at,txt:`<b>${esc(x.by)}</b> が ${({confirm:'OK',reject:'やり直し',submit:'結果を渡した',answer:'回答',approve:'承認'})[x.kind]||x.kind}（${label(x.phase)}）${x.note?' · '+esc(x.note):''}`}))].sort((a,b)=>b.at.localeCompare(a.at)).map(r=>`<li><span class="tm">${r.at.slice(5,16).replace('T',' ')}</span><span>${r.txt}</span></li>`).join('')}</ul></div>`;
  PV.mount($('flow-canvas'));paintIcons(el)}
paintIcons(document);
route();setInterval(()=>{if(!document.hidden)load()},5000);
</script>
</body>
</html>
